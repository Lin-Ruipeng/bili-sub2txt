[project]
name = "bili-sub2txt"
version = "0.3.0"
description = "Convert Bilibili subtitles to plain text — local VTT conversion and BV-number download"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "folin", email = "Lin-Ruipeng@users.noreply.github.com" },
]
keywords = ["bilibili", "subtitle", "vtt", "txt", "converter", "bv"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
download = ["qrcode[pil]>=7.4"]

[project.scripts]
bili-sub2txt = "bili_sub2txt.cli:main"

[project.urls]
Homepage = "https://github.com/Lin-Ruipeng/bili-sub2txt"
Repository = "https://github.com/Lin-Ruipeng/bili-sub2txt"
Issues = "https://github.com/Lin-Ruipeng/bili-sub2txt/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bili_sub2txt"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "README.en.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
