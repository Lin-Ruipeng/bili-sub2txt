[project]
name = "bili-sub2txt"
version = "0.2.0"
description = "Convert Bilibili subtitles to plain text — local VTT conversion and BV-number download"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
download = ["qrcode>=7.4"]

[project.scripts]
bili-sub2txt = "bili_sub2txt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bili_sub2txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
